# Replace C:\EPS-MCP with the directory where this archive was extracted.
# This file is a sample for adding two entries to an MCP client configuration.

[mcp_servers.eps]
command = 'C:\EPS-MCP\eps\.venv\Scripts\python.exe'
args = ['C:\EPS-MCP\eps\mcp\server.py']

[mcp_servers.eps_reconstruction]
command = 'C:\EPS-MCP\eps_reconstruction\.venv\Scripts\python.exe'
args = ['C:\EPS-MCP\eps_reconstruction\mcp\offline_server.py']
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers.eps_reconstruction.env]
EPS_MCP_ASSET_CATALOG = 'C:\EPS-MCP\eps_reconstruction\demo\catalog.json'
EPS_MCP_CASE_ROOT = 'C:\EPS-MCP\eps_reconstruction\runs'
# Enable only after configuring a compatible Windows EPS worker and native scenes.
# EPS_MCP_NATIVE_SCENES = 'C:\EPS-MCP\native-worker\native-scenes.json'
